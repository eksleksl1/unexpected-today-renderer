name: Analyze collected candidate
"on":
  workflow_dispatch:
    inputs:
      job_id: { required: true, type: string }
      title: { required: true, type: string }
      script: { required: true, type: string }
      image_urls: { required: true, type: string }
      callback_url: { required: true, type: string }
      callback_token: { required: true, type: string }
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-nanum tesseract-ocr tesseract-ocr-kor
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Prepare job
        env:
          JOB_ID: ${{ inputs.job_id }}
          TITLE: ${{ inputs.title }}
          SCRIPT: ${{ inputs.script }}
          IMAGE_URLS: ${{ inputs.image_urls }}
        run: python -c 'import json,os;open("job.json","w").write(json.dumps({"job_id":os.environ["JOB_ID"],"title":os.environ["TITLE"],"script":os.environ["SCRIPT"],"image_urls":json.loads(os.environ["IMAGE_URLS"])},ensure_ascii=False))'
      - name: Analyze media
        id: analysis
        continue-on-error: true
        run: python analyze.py job.json 2>analysis-error.txt
      - name: Prepare rejected result
        if: steps.analysis.outcome != 'success'
        run: |
          mkdir -p analysis-output
          ERROR=$(tail -c 1200 analysis-error.txt | jq -Rs .)
          printf '{"error":%s,"frames":0}' "$ERROR" > analysis-output/manifest.json
      - name: Publish analysis result
        if: always()
        run: |
          BRANCH="analysis-${{ inputs.job_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "$BRANCH"
          git rm -rf . || true
          mkdir -p result
          cp -R analysis-output/. result/
          git add -f result
          git commit -m "Publish analysis ${{ inputs.job_id }}"
          git push --force origin "HEAD:refs/heads/$BRANCH"
